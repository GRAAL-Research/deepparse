name: Tests

# A push on a branch that also has an open pull request would otherwise trigger two identical runs,
# doubling the number of jobs that download the pre-trained models from the HuggingFace Hub at the
# same time, which is enough to hit the Hub's anonymous rate limit (HTTP 429).
on:
  push:
    branches: [ main, dev, stable ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      # Appears that we get disk memory space problem, thus as recommended by this
      # thread (https://github.com/actions/runner-images/issues/2840#issuecomment-790492173)
      # we clean the runner before starting the tests to free some spaces.
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache the downloaded models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deepparse
            ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('deepparse/download_tools.py') }}
          restore-keys: |
            models-${{ runner.os }}-
      - name: Install dependencies
        run: |
          pip install -e .[all]
      - name: Test with pytest
        # An authenticated Hub request gets a much larger quota than an anonymous one. The token is
        # optional: without the secret, the variable is empty and the requests stay anonymous.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest

  windowsbuild:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache the downloaded models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deepparse
            ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('deepparse/download_tools.py') }}
          restore-keys: |
            models-${{ runner.os }}-
      - name: Install dependencies
        run: |
          pip install -e .[all]
      - name: Test with pytest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest
