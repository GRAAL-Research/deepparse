name: Docs

on:
  push:
    branches:
      - main
      - dev
      - stable
  pull_request:
    branches:
      - dev

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -e .[all] -r docs/requirements.txt
      - name: Building doc (warnings and broken references are errors)
        env:
          SPHINXOPTS: "-W --keep-going -n"
        run: |
          cd docs
          ./rebuild_html_doc.sh
          cd ..
